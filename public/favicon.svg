<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid navy circle background -->
  <circle cx="256" cy="256" r="244" fill="hsl(215, 50%, 22%)" />
  <!-- Thin inner ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.85" />
  <!-- ER serif monogram, white, centered -->
  <text x="256" y="256"
        text-anchor="middle"
        dominant-baseline="central"
        font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif"
        font-weight="500"
        font-style="italic"
        font-size="240"
        fill="#ffffff"
        letter-spacing="-8">ER</text>
</svg>
